  <text class="s" x="225" y="157">TF-IDF</text>
  <text class="s" x="225" y="174">→ PCA (6 dims)</text>
  <text class="s" x="225" y="191">→ angles in [0, π]</text>

  <rect x="320" y="50" width="400" height="210" rx="12" fill="#ddf4ff" stroke="#54aeff" stroke-width="1.5"/>
